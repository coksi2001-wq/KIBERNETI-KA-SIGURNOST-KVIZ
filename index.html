<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberSafe Kviz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: jedna kolona za mobitel (pristup preko QR koda), jedno pitanje po ekranu, kartica na lavandastoj podlozi */
:root{
  --bg:#F6F4FB; --surface:#FFFFFF; --ink:#121826; --muted:#5E6878; --line:#E4DFF3;
  --accent:#7C5BD6; --accent-ink:#5B3FB8; --accent-soft:#EFE9FC;
  --good:#17865A; --good-soft:#E3F5EC; --bad:#C93B3B; --bad-soft:#FBE9E9;
  --display:"Poppins", "Segoe UI", system-ui, sans-serif;
  --body:"DM Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1120; --surface:#181B2D; --ink:#ECEAF6; --muted:#A5ABBD; --line:#2C2F48;
  --accent:#A08AF2; --accent-ink:#C3B4FA; --accent-soft:#272246;
  --good:#4CC892; --good-soft:#15362A; --bad:#F07C7C; --bad-soft:#3D1D22; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1120; --surface:#181B2D; --ink:#ECEAF6; --muted:#A5ABBD; --line:#2C2F48;
  --accent:#A08AF2; --accent-ink:#C3B4FA; --accent-soft:#272246;
  --good:#4CC892; --good-soft:#15362A; --bad:#F07C7C; --bad-soft:#3D1D22; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:15px}
.brand svg{width:30px;height:30px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.count{font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px clamp(18px,5vw,30px);display:flex;flex-direction:column;gap:18px}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:5px 10px;border-radius:99px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,7vw,38px);line-height:1.12;font-weight:700}
h1 span{color:var(--accent)}
h2{font-size:clamp(20px,5vw,24px);line-height:1.25;font-weight:600}
.scenario{margin:0;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);font-size:15.5px;color:var(--ink);overflow-wrap:anywhere}
.scenario b{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-weight:600;font-size:14.5px}
p{margin:0}
.lead{color:var(--muted)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;width:100%;
  padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:16px;line-height:1.4;
  transition:border-color .15s, background .15s, transform .1s;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}

.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb strong{font-family:var(--display);font-size:16px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}

.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-family:var(--display);font-weight:600;font-size:16px;
  padding:14px 22px;border-radius:14px;background:var(--accent);color:var(--surface)}
.btn:hover{filter:brightness(1.07)} .btn:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1.5px solid var(--line)}

.topics{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.topics li{font-size:14px;font-weight:500;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}

.score{display:flex;align-items:baseline;gap:8px;font-family:var(--display)}
.score b{font-size:64px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score span{font-size:22px;color:var(--muted);font-weight:600}
.review{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.review li{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.review .m{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--surface)}
.review .m.y{background:var(--good)} .review .m.n{background:var(--bad)}
.review em{font-style:normal;color:var(--muted);display:block;font-size:14px}
footer{text-align:center;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 4.5 6.8v8.4c0 7.2 4.9 12.4 11.5 14.3 6.6-1.9 11.5-7.1 11.5-14.3V6.8Z" fill="var(--accent)"/><rect x="11" y="14" width="10" height="8" rx="1.6" fill="var(--surface)"/><path d="M13 14v-2.2a3 3 0 0 1 6 0V14" fill="none" stroke="var(--surface)" stroke-width="1.8"/></svg>
      <div>CyberSafe Personal<small>Kviz znanja</small></div>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
  </header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <main class="card" id="card"></main>
  <footer>Melius Solutions · Danas naučite. Danas postavite. Danas se zaštitite.</footer>
</div>

<script>
const Q = [
 {t:"Phishing", q:"Stigao vam je ovaj e-mail. Što je najbolje učiniti?",
  s:"„Vaš račun bit će blokiran za 24 sata. Kliknite ovdje i potvrdite svoje podatke.”",
  o:["Kliknuti na poveznicu i brzo potvrditi podatke","Odgovoriti na e-mail i pitati je li stvaran","Ne klikati, nego sam otvoriti službenu stranicu ili aplikaciju i provjeriti račun","Proslijediti e-mail prijateljima da ih upozorite"],
  a:2, e:"Pritisak vremenom („24 sata”) tipičan je trik phishinga. Ne klikajte poveznice iz takvih poruka. Službenu stranicu otvorite sami, upisivanjem adrese ili preko aplikacije."},
 {t:"Phishing", q:"Koja je od ovih adresa najvjerojatnije lažna?",
  o:["https://www.banka.hr/prijava","https://banka.hr.sigurna-prijava.com","https://online.banka.hr"],
  a:1, e:"Gleda se dio adrese neposredno prije prve kose crte. Ovdje je to sigurna-prijava.com, a ne banka.hr. „banka.hr” na početku samo je mamac."},
 {t:"Smishing", q:"Dobili ste SMS. Što je ovo najvjerojatnije?",
  s:"„Vaš paket čeka na isporuku. Platite 1,99 € carine: <b>paket-dostava.info/hr</b>”",
  o:["Uobičajena obavijest dostavne službe","Smishing, odnosno phishing putem SMS-a","Reklamna poruka koju možete slobodno otvoriti"],
  a:1, e:"Smishing je phishing putem SMS-a. Mali iznos i nepoznata poveznica služe za krađu podataka s kartice. Status paketa provjerite u službenoj aplikaciji ili na stranici dostavne službe."},
 {t:"2FA", q:"Zove vas „podrška banke” i traži da im pročitate kod koji vam je upravo stigao porukom. Što učiniti?",
  o:["Pročitati kod jer zovu iz banke","Prekinuti razgovor i nikome ne davati kod","Poslati kod e-mailom umjesto telefonom"],
  a:1, e:"Jednokratni kod služi samo vama. Banka ga nikad neće tražiti. Tko dobije kod, može ući u vaš račun čak i ako zna samo lozinku."},
 {t:"2FA", q:"Što je dvostruka autentifikacija (2FA)?",
  o:["Dvije različite lozinke za isti račun","Drugi korak prijave uz lozinku, npr. kod iz aplikacije ili sigurnosni ključ","Prijava s dva različita uređaja istovremeno"],
  a:1, e:"Uz ono što znate (lozinku) dodaje se nešto što imate, npr. mobitel s aplikacijom za autentifikaciju. Ukradena lozinka tada sama nije dovoljna za ulazak."},
 {t:"2FA", q:"Koja je od ovih metoda drugog koraka sigurnija od koda putem SMS-a?",
  o:["Kod iz aplikacije za autentifikaciju (npr. Google ili Microsoft Authenticator)","Ista lozinka upisana dva puta","Sigurnosno pitanje, npr. ime ljubimca"],
  a:0, e:"Kod iz aplikacije stvara se na vašem mobitelu i ne putuje mrežom, pa ga je teže presresti nego SMS, koji se može preusmjeriti zamjenom SIM kartice."},
 {t:"Password keeperi", q:"Koja je glavna prednost upravitelja lozinki (password keepera)?",
  o:["Možete koristiti istu lozinku svugdje","Svaki račun ima jedinstvenu jaku lozinku, a vi pamtite samo jednu glavnu","Lozinke više nisu potrebne"],
  a:1, e:"Upravitelj stvara i pamti različitu jaku lozinku za svaki račun. Ako jedna stranica procuri, ostali računi ostaju sigurni."},
 {t:"Password keepers", q:"Upravitelj lozinki ne nudi automatsko popunjavanje na stranici koja izgleda točno kao vaša banka. Što to može značiti?",
  o:["Upravitelj lozinki se pokvario","Stranica je možda lažna jer joj adresa nije ista kao prava","Treba ručno kopirati lozinku iz upravitelja"],
  a:1, e:"Upravitelj lozinki ne gleda kako stranica izgleda, nego provjerava njezinu adresu. Ako ne nudi popunjavanje, provjerite adresu i ne upisujte lozinku ručno."},
 {t:"Lozinke", q:"Koja je od ovih lozinki najjača?",
  o:["Ljeto2024!","P@ssw0rd","plava-bicikla-skace-preko-rijeke","Ivan1985"],
  a:2, e:"Duljina je najvažnija. Duga fraza od više nepovezanih riječi puno je teža za probijanje od kratke lozinke s pokojim znakom, a lakše se pamti."},
 {t:"Kibernetička sigurnost", q:"Zašto je važno redovito instalirati ažuriranja na mobitelu i računalu?",
  o:["Samo zbog novog izgleda i funkcija","Ažuriranja ispravljaju sigurnosne propuste koje napadači koriste","Ažuriranja usporavaju uređaj pa ih je bolje preskočiti"],
  a:1, e:"Velik dio napada koristi već poznate propuste za koje postoje zakrpe. Uključite automatska ažuriranja kad god je moguće."}
];
const L="ABCD";
let i=-1, answers=[];
const card=document.getElementById('card'), bar=document.getElementById('bar'), count=document.getElementById('count');

function intro(){
  i=-1; answers=[]; bar.style.width='0'; count.textContent='10 pitanja';
  card.innerHTML=`
    <span class="tag">Provjerite znanje</span>
    <h1>Prepoznajete li <span>prijevaru</span> na vrijeme?</h1>
    <p class="lead">Deset kratkih pitanja o temama iz prezentacije. Nakon svakog odgovora vidjet ćete točan odgovor i kratko objašnjenje.</p>
    <ul class="topics"><li>Phishing</li><li>Smishing</li><li>2FA</li><li>Password keeperi</li><li>Kibernetička sigurnost</li></ul>
    <button class="btn" id="start">Započni kviz</button>`;
  document.getElementById('start').onclick=()=>{i=0;show();};
}
function show(){
  const it=Q[i];
  count.textContent=`${i+1} / ${Q.length}`;
  bar.style.width=`${(i/Q.length)*100}%`;
  card.innerHTML=`
    <span class="tag">${it.t.replace('keepers','keeperi')}</span>
    <h2>${it.q}</h2>
    ${it.s?`<p class="scenario">${it.s}</p>`:''}
    <div class="opts">${it.o.map((o,k)=>`<button class="opt" id="o${i}_${k}" data-k="${k}"><span class="k">${L[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div id="fbslot"></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  card.querySelector('.opt').focus({preventScroll:true});
}
function pick(k){
  const it=Q[i], ok=k===it.a; answers[i]=k;
  card.querySelectorAll('.opt').forEach(b=>{
    const n=+b.dataset.k; b.disabled=true;
    if(n===it.a) b.classList.add('right'); else if(n===k) b.classList.add('wrong'); else b.classList.add('dim');
  });
  bar.style.width=`${((i+1)/Q.length)*100}%`;
  const last=i===Q.length-1;
  document.getElementById('fbslot').outerHTML=`
    <div class="fb ${ok?'ok':'no'}" role="status"><strong>${ok?'Točno!':'Nije točno.'}</strong><p>${it.e}</p></div>
    <button class="btn" id="next">${last?'Pogledaj rezultat':'Sljedeće pitanje'}</button>`;
  const nb=document.getElementById('next'); nb.focus({preventScroll:true});
  nb.onclick=()=>{ if(last) result(); else { i++; show(); window.scrollTo({top:0,behavior:'smooth'}); } };
}
function result(){
  const n=answers.filter((a,k)=>a===Q[k].a).length;
  count.textContent='Rezultat'; bar.style.width='100%';
  const msg = n===10?'Odlično! Prevaranti kod vas nemaju šanse.' : n>=8?'Vrlo dobro! Još malo i znate sve.' : n>=5?'Dobra osnova. Pogledajte pitanja koja ste promašili.' : 'Ovo je dobar trenutak da ponovite gradivo s prezentacije.';
  card.innerHTML=`
    <span class="tag">Vaš rezultat</span>
    <div class="score"><b>${n}</b><span>/ ${Q.length} točnih</span></div>
    <h2>${msg}</h2>
    <ul class="review">${Q.map((it,k)=>{const y=answers[k]===it.a;return `<li><span class="m ${y?'y':'n'}">${y?'✓':'✗'}</span><span>${it.q}${y?'':`<em>Točan odgovor: ${it.o[it.a]}</em>`}</span></li>`}).join('')}</ul>
    <button class="btn ghost" id="again">Riješi ponovno</button>`;
  document.getElementById('again').onclick=()=>{intro();window.scrollTo({top:0,behavior:'smooth'});};
  window.scrollTo({top:0,behavior:'smooth'});
}
intro();
</script>
</body>
</html>
